/* ---------- Units & tokens ---------- */
:root{
  --u:calc(100vh / 1058);
  --uw:calc(100vw / 1487);
  --h:clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
  --m:1px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ink:#fafafa;
  --muted:#a7a6a6;
  --nav:#b6b5b5;
  --strip:#8b8a8a;
  --pill:#ffffff;
  --pill-ink:#050505;
  --bg:#050505;
}
@supports (height:100dvh){ :root{ --u:calc(100dvh / 1058); } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
a{color:inherit;text-decoration:none}
svg{display:block}

/* ---------- Stage ---------- */
.stage{position:relative;width:100%;height:100%;overflow:hidden}

/* ---------- Full-bleed video plate ---------- */
.plate{position:absolute;top:0;bottom:0;left:calc(50% - 50vw);right:calc(50% - 50vw);overflow:hidden;z-index:0}
.plate video{
  position:absolute;left:50%;
  top:calc(1 * var(--u));
  width:calc(1492 * var(--u));
  height:calc(1054 * var(--u));
  transform:translateX(calc(-50% - calc(.5 * var(--u))));
  object-fit:cover;pointer-events:none;
}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(5,5,5,0) 78.8%,
      rgba(5,5,5,.23) 79.6%,
      rgba(5,5,5,.45) 81.4%,
      rgba(5,5,5,.75) 83.3%,
      rgba(5,5,5,.84) 85.2%,
      rgba(5,5,5,.888) 88%,
      rgba(5,5,5,.905) 91%,
      rgba(5,5,5,.96) 95%,
      #050505 100%),
    linear-gradient(to right,
      #050505 calc(50% - 746 * var(--u)),
      transparent calc(50% - 676 * var(--u)),
      transparent calc(50% + 676 * var(--u)),
      #050505 calc(50% + 746 * var(--u)));
}

/* ---------- Top bar ---------- */
.topbar{position:absolute;inset:0;z-index:30;pointer-events:none}
.topbar a,.topbar button{pointer-events:auto}

.brand{position:absolute;left:calc(75 * var(--u));top:calc(27 * var(--u));width:calc(31.5 * var(--u));height:calc(48.5 * var(--u))}
.brand svg{width:100%;height:100%}

.links{
  position:absolute;left:50%;top:calc(51 * var(--u));
  transform:translate(-50%,-50%);
  display:flex;align-items:center;white-space:nowrap;
  font-size:calc(19 * var(--u));font-weight:500;color:var(--nav);
}
.links a{transition:color .3s ease}
.links a:hover{color:var(--ink)}
.links a + a{margin-left:calc(24.5 * var(--u))}
.links a:nth-child(3){margin-left:calc(23.5 * var(--u))}
.links a:nth-child(4){margin-left:calc(26 * var(--u))}

.pill{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--pill);color:var(--pill-ink);border-radius:999px;
}
.pill-nav{
  position:absolute;right:calc(75.4 * var(--u));top:calc(27 * var(--u));
  width:calc(175 * var(--u));height:calc(49 * var(--u));
  font-size:calc(20.6 * var(--u));font-weight:500;
}
.pill-nav span{display:inline-block;transform:translateY(calc(1 * var(--u)))}
.pill-nav:hover,.pill-cta:hover{opacity:.92}

/* ---------- Hero ---------- */
.hero{position:absolute;inset:0;pointer-events:none;z-index:20}
.hero a{pointer-events:auto}

.headline{
  position:absolute;left:calc(75.5 * var(--u));top:calc(230.5 * var(--u));
  font-weight:400;color:var(--ink);line-height:1;
  font-size:calc(71.6 * var(--h));
  line-height:calc(80.5 * var(--h));
  letter-spacing:calc(.3 * var(--h));
}
.headline span{display:block;white-space:nowrap}

.sub{
  position:absolute;left:calc(75.5 * var(--u));
  top:calc(230.5 * var(--u) + 189 * var(--h));
  color:var(--muted);font-weight:400;
  font-size:calc(20.7 * var(--h));
  line-height:calc(23.5 * var(--h));
  word-spacing:calc(1.8 * var(--h));
}
.sub span{display:block;white-space:nowrap}

.pill-cta{
  position:absolute;left:calc(74.9 * var(--u));

<script>
(function(){
  var stage = document.getElementById('stage');
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');

  function setOpen(open){
    stage.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    menu.setAttribute('aria-hidden', String(!open));
  }

  burger.addEventListener('click', function(){
    setOpen(!stage.classList.contains('is-open'));
  });

  menu.addEventListener('click', function(e){
    if (e.target.closest('a')) setOpen(false);
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && stage.classList.contains('is-open')) setOpen(false);
  });

  window.addEventListener('resize', function(){
    if (window.innerWidth / window.innerHeight > 1.1) setOpen(false);
  });
})();
